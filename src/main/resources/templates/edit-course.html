<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Course - Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Edit Course</h2>
        <a th:href="@{/courses}" class="btn btn-secondary">Back</a>
    </div>

    <div class="card">
        <div class="card-body">

            <!-- FORM START -->
            <form th:action="@{/course/update}" 
                  th:object="${course}" 
                  method="post">

                <!-- Hidden ID -->
                <input type="hidden" th:field="*{id}"/>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Course Name</label>
                        <input type="text" class="form-control"
                               th:field="*{courseName}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Course Code</label>
                        <input type="text" class="form-control"
                               th:field="*{courseCode}" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Duration</label>
                        <input type="text" class="form-control"
                               th:field="*{duration}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Course Fee</label>
                        <input type="number" class="form-control"
                               th:field="*{fee}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Is Active</label>
                    <select class="form-select" th:field="*{active}">
                        <option th:value="true">Yes</option>
                        <option th:value="false">No</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control"
                              rows="4"
                              th:field="*{description}"></textarea>
                </div>

                <div class="text-end">
                    <a th:href="@{/courses}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary">
                        Update Course
                    </button>
                </div>

            </form>
            <!-- FORM END -->

        </div>
    </div>

</div>

</body>
</html>
