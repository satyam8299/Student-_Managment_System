<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
<div class="d-flex" id="wrapper">

    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <div id="page-content-wrapper">

        <!-- Navbar -->
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <div class="container-fluid px-4 py-4">

            <!-- Header -->
            <div class="bg-primary text-white rounded-3 p-4 mb-4">
                <div class="d-flex justify-content-between">
                    <h2>Enroll Student to Courses</h2>
                    <a th:href="@{/students/list}"
                       class="btn btn-light text-primary fw-semibold">
                        <i class="bi bi-arrow-left me-1"></i> Back
                    </a>
                </div>
            </div>

            <!-- ✅ SINGLE FORM ONLY -->
            <form th:action="@{/enrollments/save}"
                  th:object="${enrollmentDTO}"
                  method="post">

                <!-- CSRF -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />

                <div class="row g-4">

                    <!-- LEFT SIDE COURSES -->
                    <div class="col-lg-8">
                        <div class="card h-100">
                            <div class="card-header bg-white">
                                <i class="bi bi-list-check me-1"></i> Course Selection
                            </div>

                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle">
                                        <thead>
                                        <tr>
                                            <th>Select</th>
                                            <th>Course Name</th>
                                            <th class="text-end">Fee</th>
                                        </tr>
                                        </thead>

                                        <tbody>
                                        <tr th:each="course : ${courseList}">
                                            <td>
                                                <input type="checkbox"
                                                       th:value="${course.id}"
                                                       th:field="*{courseIds}"
                                                       class="form-check-input course-check"
                                                       th:data-fee="${course.fee}">
                                            </td>

                                            <td th:text="${course.courseName}"></td>

                                            <td class="text-end"
                                                th:text="'₹ ' + ${course.fee}">
                                            </td>
                                        </tr>
                                        </tbody>

                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- RIGHT SIDE STUDENT + SUMMARY -->
                    <div class="col-lg-4">
                        <div class="card h-100">
                            <div class="card-header bg-white">
                                <i class="bi bi-person-check me-1"></i> Student & Summary
                            </div>

                            <div class="card-body">

                                <!-- Student Dropdown -->
                                <div class="mb-3">
                                    <label class="form-label">Select Student</label>

                                    <select class="form-select"
                                            th:field="*{studentId}"
                                            required>

                                        <option value="">Select Student</option>

                                        <option th:each="student : ${studentList}"
                                                th:value="${student.id}"
                                                th:text="${student.firstName + ' ' + student.lastName + ' (' + student.email + ')'}">
                                        </option>

                                    </select>
                                </div>

                                <hr>

                                <!-- Summary -->
                                <div class="p-3 bg-light border rounded mb-3">
                                    <div class="d-flex justify-content-between">
                                        <span>Courses Selected</span>
                                        <strong id="courseCount">0</strong>
                                    </div>

                                    <div class="d-flex justify-content-between">
                                        <span>Total Fee</span>
                                        <strong class="text-primary">
                                            ₹ <span id="totalFee">0</span>
                                        </strong>
                                    </div>
                                </div>

                                <div class="d-flex gap-2">
                                    <a th:href="@{/students/list}"
                                       class="btn btn-outline-secondary w-50">
                                        Cancel
                                    </a>

                                    <button type="submit"
                                            class="btn btn-primary w-50">
                                        <i class="bi bi-check2-circle me-1"></i>
                                        Enroll
                                    </button>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>
            </form>

        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

<!-- JS FOR TOTAL CALCULATION -->
<script>
    document.addEventListener("DOMContentLoaded", function () {

        const checkboxes = document.querySelectorAll(".course-check");
        const totalFeeEl = document.getElementById("totalFee");
        const countEl = document.getElementById("courseCount");

        function updateSummary() {
            let total = 0;
            let count = 0;

            checkboxes.forEach(cb => {
                if (cb.checked) {
                    total += parseFloat(cb.dataset.fee);
                    count++;
                }
            });

            totalFeeEl.innerText = total;
            countEl.innerText = count;
        }

        checkboxes.forEach(cb => {
            cb.addEventListener("change", updateSummary);
        });
    });
</script>

</body>
</html>
