<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>


<body class="login-body">

<div class="card login-card" style="width:100%; max-width:420px; margin:auto; margin-top:80px;">

    <div class="login-header text-center text-white bg-primary p-3">
        <h2 class="mb-1">SMS</h2>
        <p class="mb-0 opacity-75">Student Management System</p>
    </div>

    <div class="card-body p-4">

        <h4 class="text-center mb-4 fw-bold">Welcome Back</h4>

        <!-- 🔥 IMPORTANT FORM -->
        <form th:action="@{/login}" method="post">

            <!-- Username -->
            <div class="mb-3">
                <label class="form-label small fw-bold">USERNAME</label>
                <input type="text"
                       class="form-control"
                       name="username"
                       placeholder="Enter your username"
                       required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label small fw-bold">PASSWORD</label>
                <input type="password"
                       class="form-control"
                       name="password"
                       placeholder="Enter your password"
                       required>
            </div>

            <!-- ✅ CSRF TOKEN (MOST IMPORTANT) -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <div class="d-grid">
                <button type="submit" class="btn btn-primary">
                    Login
                </button>
            </div>

        </form>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
